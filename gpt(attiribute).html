
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Selectors</title>

    <style>

        /* ========== ATTRIBUTE SELECTORS ========== */

        /* 1. Exact Attribute Value */
        p[lang="en"] {
            color: red;
        }

        /* 2. Exact Value OR Value Followed By Hyphen */
        p[lang|="en"] {
            color: green;
        }

        /* 3. Attribute Contains Word */
        p[title~="hello"] {
            background-color: yellow;
        }

        /* 4. Attribute Contains Substring */
        p[lang*="fr"] {
            border: 2px solid blue;
        }

        /* 5. Attribute Starts With */
        p[title^="Ronaldo"] {
            color: purple;
        }

        /* 6. Attribute Ends With */
        p[title$="html"] {
            background-color: lightblue;
        }

        /* 7. Attribute Exists */
        p[title] {
            padding: 5px;
        }


        /* ========== LINK SELECTORS ========== */

        /* 1. Unvisited Link */
        a:link {
            color: blue;
        }

        /* 2. Visited Link */
        a:visited {
            color: purple;
        }

        /* 3. Mouse Hover */
        a:hover {
            color: red;
            text-decoration: none;
        }

        /* 4. Active Link (Click) */
        a:active {
            color: green;
        }


        /* ========== FOCUS SELECTOR ========== */

        input:focus {
            background-color: lightyellow;
            border: 2px solid blue;
            outline: none;
        }


        /* ========== FOCUS-VISIBLE SELECTOR ========== */

        button:focus-visible {
            outline: 3px solid orange;
            outline-offset: 3px;
        }


        /* ========== CHECKBOX SELECTOR ========== */

        input[type="checkbox"]:checked {
            accent-color: green;
        }

        input[type="checkbox"]:checked + label {
            color: green;
            font-weight: bold;
        }


        /* ========== EXTRA USEFUL SELECTORS ========== */

        /* Disabled Input */
        input:disabled {
            background-color: lightgray;
        }

        /* Enabled Input */
        input:enabled {
            border: 1px solid black;
        }

        /* Required Input */
        input:required {
            border-left: 4px solid red;
        }

        /* Optional Input */
        input:optional {
            background-color: #f0f0f0;
        }

        /* First Child */
        p:first-child {
            font-weight: bold;
        }

        /* Last Child */
        p:last-child {
            font-style: italic;
        }

    </style>
</head>

<body>

    <h1>CSS Attribute Selectors</h1>

    <p lang="en">This is English</p>

    <p lang="en-US">This is English US</p>

    <p lang="fr">This is French</p>

    <p title="hello world">Contains hello word</p>

    <p title="Ronaldo Football">Starts with Ronaldo</p>

    <p title="My page html">Ends with html</p>

    <p title="Normal paragraph">Attribute exists</p>


    <hr>

    <h1>Link Selectors</h1>

    <a href="https://www.google.com">Google Link</a>

    <br><br>

    <a href="https://www.wikipedia.org">Wikipedia Link</a>


    <hr>

    <h1>Focus Selector</h1>

    <input type="text" placeholder="Click here to focus">

    <br><br>

    <h1>Focus Visible</h1>

    <button>Press Tab and Focus Me</button>


    <hr>

    <h1>Checkbox Selector</h1>

    <input type="checkbox" id="football">

    <label for="football">Football</label>

    <br><br>

    <input type="checkbox" id="cricket">

    <label for="cricket">Cricket</label>


    <hr>

    <h1>Extra Selectors</h1>

    <input type="text" placeholder="Enabled Input">

    <br><br>

    <input type="text" placeholder="Disabled Input" disabled>

    <br><br>

    <input type="text" placeholder="Required Input" required>

</body>
</html>
