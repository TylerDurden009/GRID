
<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Navbar</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    .container {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background-color: aqua;
      padding: 15px 30px;
      gap: 20px;
    }

    .logo {
      font-size: 30px;
      font-weight: bold;
    }

    .home {
      display: flex;
      align-items: center;
      gap: 30px;
    }

    .items {
      font-size: 18px;
      cursor: pointer;
    }

    .buttons {
      display: flex;
      align-items: center;
      gap: 15px;
    }

    .btn {
      padding: 10px 20px;
      border: none;
      border-radius: 5px;
      font-size: 16px;
      cursor: pointer;
    }

    .login {
      background-color: transparent;
    }

    .signup {
      background-color: royalblue;
      color: white;
    }

    @media (max-width: 650px) {
      .container {
        flex-wrap: wrap;
      }

      .home {
        order: 3;
        width: 100%;
        justify-content: center;
        flex-wrap: wrap;
        gap: 15px;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="logo">Startup 3</div>

    <div class="home">
      <div class="items">Prices</div>
      <div class="items">About</div>
      <div class="items">FAQ</div>
      <div class="items">Support</div>
    </div>

    <div class="buttons">
      <button class="btn login">Login</button>
      <button class="btn signup">Sign Up</button>
    </div>

  </div>

</body>
</html>
