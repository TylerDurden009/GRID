
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced Admin Dashboard</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 20px;
            font-family: Arial, sans-serif;
            background: #f1f5f9;
        }

        .container {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            grid-template-rows: 70px 120px 100px 100px 120px 70px 70px;
            gap: 10px;
            max-width: 1100px;
            margin: auto;
        }

        .container > div {
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            font-weight: bold;
            border-radius: 8px;
            padding: 10px;
        }

        .header {
            grid-column: 1 /7;
            background: #2563eb;
        }

        .sidebar {
            grid-column: 1 / 2;
            grid-row: 2 / 6;
            background: #475569;
        }

        .main {
            grid-column: 2 / 5;
            grid-row: 2 / 4;
            background: #0d9488;
        }

        .profile {
            grid-column: 5 / 7;
            grid-row: 2 / 3;
            background: #d97706;
        }

        .notification {
            grid-column: 5 / 7;
            grid-row: 3 / 4;
            background: #9333ea;
        }

        .stat1 {
            grid-column: 2 / 4;
            grid-row: 4 / 5;
            background: #0891b2;
        }

        .stat2 {
            grid-column: 4 / 5;
            grid-row: 4 / 5;
            background: #0891b2;
        }

        .stat3 {
            grid-column: 5 / 7;
            grid-row: 4 / 5;
            background: #0891b2;
        }

        .chart {
            grid-column: 2 / 4;
            grid-row: 5 / 6;
            background: #be123c;
        }

        .boxA {
            grid-column: 4 / 5;
            grid-row: 5 / 6;
            background: #7c3aed;
        }

        .boxB {
            grid-column: 5 / 6;
            grid-row: 5 / 6;
            background: #7c3aed;
        }

        .boxC {
            grid-column: 6 / 7;
            grid-row: 5 / 6;
            background: #7c3aed;
        }

        .table {
            grid-column: 1 / 7;
            grid-row: 6 / 7;
            background: #334155;
        }

        .footer {
            grid-column: 1 / 7;
            grid-row: 7 / 8;
            background: #111827;
        }

        @media (max-width: 650px) {
            .container {
                grid-template-columns: repeat(2, 1fr);
                grid-auto-rows: 90px;
            }

            .container > div {
                grid-column: auto;
                grid-row: auto;
            }

            .header, .footer, .table {
                grid-column: 1 / 3;
            }

            .sidebar {
                grid-column: 1 / 3;
            }

            .main {
                grid-column: 1 / 3;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="header">HEADER</div>

        <div class="sidebar">SIDEBAR</div>

        <div class="main">MAIN CONTENT</div>

        <div class="profile">PROFILE</div>

        <div class="notification">NOTIFICATION</div>

        <div class="stat1">STAT 1</div>

        <div class="stat2">STAT 2</div>

        <div class="stat3">STAT 3</div>

        <div class="chart">CHART</div>

        <div class="boxA">BOX A</div>

        <div class="boxB">BOX B</div>

        <div class="boxC">BOX C</div>

        <div class="table">TABLE</div>

        <div class="footer">FOOTER</div>

    </div>

</body>
</html>
